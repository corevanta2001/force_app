name: Build FORCE Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build 3 APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Android Files (supports kts and gradle)
        run: |
          ls -R android/
          (test -f android/settings.gradle.kts || test -f android/settings.gradle) || (echo "NO SETTINGS FILE" && exit 1)
          (test -f android/build.gradle.kts || test -f android/build.gradle) || (echo "NO BUILD FILE" && exit 1)
          (test -f android/app/build.gradle.kts || test -f android/app/build.gradle) || (echo "NO APP BUILD FILE" && exit 1)
          echo "Android project OK"

      - run: flutter pub get

      - name: Build 1 - Debug APK
        run: flutter build apk --debug --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Build 2 - Release Split APKs (3 ABIs)
        run: flutter build apk --release --split-per-abi --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Build 3 - Release AAB
        run: flutter build appbundle --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: force-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK Release Split
        uses: actions/upload-artifact@v4
        with:
          name: force-apk-release-split
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload AAB Release
        uses: actions/upload-artifact@v4
        with:
          name: force-aab-release
          path: build/app/outputs/bundle/release/app-release.aab
