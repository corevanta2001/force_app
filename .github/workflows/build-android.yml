name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean Gradle Cache (fix corrupted D8)
        run: rm -rf ~/.gradle/caches ~/.gradle/wrapper

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Downgrade geolocator_android that forces location 21.2.0
      - name: Force compatible geolocator
        run: |
          flutter pub add geolocator_android:4.5.0
          flutter pub get

      - run: flutter clean
      - run: flutter build apk --release --split-per-abi --no-tree-shake-icons --no-shrink -v

      - uses: actions/upload-artifact@v4
        with:
          name: force-app-apk
          path: build/app/outputs/flutter-apk/*.apk
